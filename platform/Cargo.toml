[package]
name = "adln-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Shared ADLN server account storage"

[dependencies]
adln-networking = { path = ".." }
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }

[lints.rust]
unsafe_code = "forbid"
